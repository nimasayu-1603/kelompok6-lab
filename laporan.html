<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InventraLab - Buat Laporan</title>
    <link rel="stylesheet" href="style.css">
    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') { window.location.href = 'index.html'; }
    </script>
</head>
<body>
    <div id="appScreen" style="display:flex;">
        <header class="topbar">
            <div class="brand">
                <div class="brand-logo">IL</div>
                <div class="brand-text">InventraLab</div>
            </div>
            <div class="user-info">
                <div class="user-details">
                    <strong id="userNameDisplay">User</strong>
                    <span id="userRoleDisplay">Role</span>
                </div>
                <button onclick="sessionStorage.clear(); window.location.href='index.html';" class="btn-logout">LR</button>
            </div>
        </header>

        <nav class="nav-bar">
            <a href="index.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg><span>Beranda</span></a>
            <a href="riwayat.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><span>Riwayat</span></a>
            <a href="#" class="active"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg><span>Laporan</span></a>
            <a href="dashboard.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg><span>Dasbor</span></a>
            <a href="panduan.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><span>Panduan</span></a>
            <a href="kontak.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg><span>Kontak</span></a>
        </nav>

        <main>
            <div class="section-head">
                <div>
                    <p class="eyebrow">FORMULIR</p>
                    <h2>Buat Laporan</h2>
                </div>
                <span class="badge badge-good">Aktif</span>
            </div>

            <form id="formLaporan" class="form-card">
                <div class="field full">
                    <label>Nama pelapor</label>
                    <input id="nama" type="text" required placeholder="Masukkan nama">
                </div>
                <div class="field">
                    <label>Peran</label>
                    <select id="peran">
                        <option>Laboran</option><option>Kepala Jurusan</option><option>Siswa RPL</option><option>Siswa DKV</option>
                    </select>
                </div>
                <div class="field">
                    <label>Lab Komputer</label>
                    <select id="lab">
                        <option>Lab Komputer 1</option>
                        <option>Lab Komputer 2</option>
                        <option>Lab Komputer 3</option>
                        <option>Lab Komputer 4</option>
                        <option>Lab Komputer 5</option>
                        <option>Lab Komputer 6</option>
                        <option>Lab Komputer 7</option>
                        <option>Lab Komputer 8</option>
                        <option>Lab Komputer 9</option>
                        <option>Lab Komputer 10</option>
                    </select>
                </div>
                <div class="field">
                    <label>Kode perangkat</label>
                    <input id="kode" type="text" required placeholder="Contoh: LAB-001">
                </div>
                <div class="field">
                    <label>Kondisi</label>
                    <select id="kondisi">
                        <option>Baik</option><option>Perlu Perbaikan</option><option>Rusak</option><option>Hilang</option>
                    </select>
                </div>
                <div class="field full">
                    <label>Catatan</label>
                    <textarea id="catatan" placeholder="Jelaskan kerusakan atau perubahan..."></textarea>
                </div>
                <div class="form-actions">
                    <a href="index.html" class="btn-secondary">Batal</a>
                    <button type="submit" class="btn-primary">Kirim Laporan</button>
                </div>
            </form>
        </main>
    </div>

    <script>
        document.getElementById('userNameDisplay').innerText = sessionStorage.getItem('userName') || 'User';
        document.getElementById('userRoleDisplay').innerText = sessionStorage.getItem('userRole') || 'Role';
        
        const loggedInName = sessionStorage.getItem('userName');
        if (loggedInName) document.getElementById('nama').value = loggedInName;

        document.getElementById('formLaporan').addEventListener('submit', function(e) {
            e.preventDefault();
            const laporanBaru = {
                id: Date.now(),
                nama: document.getElementById('nama').value,
                peran: document.getElementById('peran').value,
                lab: document.getElementById('lab').value,
                kode: document.getElementById('kode').value,
                kondisi: document.getElementById('kondisi').value,
                catatan: document.getElementById('catatan').value,
                tanggal: new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' })
            };
            let dataRiwayat = JSON.parse(localStorage.getItem('inventraLabData')) || [];
            dataRiwayat.unshift(laporanBaru);
            localStorage.setItem('inventraLabData', JSON.stringify(dataRiwayat));
            alert('Laporan berhasil disimpan!');
            window.location.href = 'riwayat.html';
        });
    </script>
</body>
</html>
