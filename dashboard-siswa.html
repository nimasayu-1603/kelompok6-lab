<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InventraLab - Dasbor Siswa</title>
    <link rel="stylesheet" href="style.css">
    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'index.html';
        if (sessionStorage.getItem('userRole') !== 'Siswa') window.location.href = 'index.html';
    </script>
</head>
<body style="display:flex; flex-direction:column; min-height:100vh; padding-bottom: 80px;">
    <div id="appScreen" style="display:flex; flex-direction:column; flex:1;">
        <header class="topbar">
            <div class="brand"><div class="brand-logo" style="background:var(--blue);">IL</div><div class="brand-text">InventraLab</div></div>
            <div class="user-info"><button onclick="sessionStorage.clear(); window.location.href='index.html';" class="btn-logout"><svg style="width:18px; height:18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg></button></div>
        </header>
        <nav class="nav-bar">
            <a href="index-siswa.html"><span>Beranda</span></a>
            <a href="dashboard-siswa.html" class="active"><span>Dasbor</span></a>
            <a href="laporan-siswa.html"><span>Laporan</span></a>
            <a href="riwayat-siswa.html"><span>Riwayat</span></a>
            <a href="kontak-siswa.html"><span>Kontak</span></a>
        </nav>
        <main style="flex:1;">
            <div class="section-title"><p class="eyebrow">RINGKASAN PRIBADI</p><h2>Dasbor Siswa</h2></div>
            <div class="metrics">
                <article><strong id="statTotal" style="color:var(--blue);">0</strong><span>Laporan Anda</span></article>
                <article><strong id="statPending" style="color:var(--orange);">0</strong><span>Menunggu</span></article>
                <article><strong id="statSelesai" style="color:var(--green);">0</strong><span>Selesai</span></article>
            </div>
        </main>
    </div>
    <footer style="text-align:center; padding:20px; font-size:13px; color:var(--muted); border-top:1px solid var(--line); background:white; margin-bottom: 60px;">Copyright &copy; 2026 - Kelompok 6</footer>
    <script>
        const currentUser = sessionStorage.getItem('userName');
        let data = JSON.parse(localStorage.getItem('inventraLabData')) || [];
        const myData = data.filter(item => item.nama === currentUser);
        document.getElementById('statTotal').innerText = myData.length;
        document.getElementById('statPending').innerText = myData.filter(d => d.status === 'Menunggu').length;
        document.getElementById('statSelesai').innerText = myData.filter(d => d.status === 'Selesai').length;
    </script>
</body>
</html>
