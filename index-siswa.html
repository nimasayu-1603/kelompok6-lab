<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InventraLab - Beranda Siswa</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Proteksi Ganda: Cek Login & Tendang Laboran
        if (sessionStorage.getItem('isLoggedIn') !== 'true') { window.location.href = 'login.html'; }
        if (sessionStorage.getItem('userRole') === 'Laboran') { window.location.href = 'index-laboran.html'; }
    </script>
</head>
<body>
    <div id="appScreen" style="display:flex;">
        <header class="topbar">
            <div class="brand">
                <div class="brand-logo">IL</div>
                <div class="brand-text">InventraLab</div>
            </div>
            <div class="user-info">
                <div class="user-details">
                    <strong id="userNameDisplay">User</strong>
                    <span id="userRoleDisplay">Role</span>
                </div>
                <!-- Logout ke login.html -->
                <button onclick="sessionStorage.clear(); window.location.href='login.html';" class="btn-logout">LR</button>
            </div>
        </header>

        <nav class="nav-bar">
            <a href="index-siswa.html" class="active">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span>Beranda</span>
            </a>
            <a href="riwayat-siswa.html">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>Riwayat</span>
            </a>
            <a href="laporan-siswa.html">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                <span>Laporan</span>
            </a>
            <a href="dashboard-siswa.html">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                <span>Dasbor</span>
            </a>
            <a href="kontak-siswa.html">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                <span>Kontak</span>
            </a>
        </nav>

        <main>
            <div class="hero-card" style="margin-bottom: 24px;">
                <p class="eyebrow">INVENTARIS LABORATORIUM</p>
                <h1>Catat perangkat.<br><span>Update kondisinya.</span></h1>
                <p class="lead">Sistem pendataan inventaris untuk mempermudah pelaporan kondisi perangkat komputer secara terpusat.</p>
                
                <a href="laporan-siswa.html" class="btn-primary" style="display:inline-flex; width:auto;">
                    <svg style="width:18px; height:18px; margin-right:8px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Buat Laporan Baru
                </a>
            </div>

            <div class="section-head">
                <h2>Laporan Terakhir</h2>
                <a href="riwayat-siswa.html" style="color:var(--blue); font-size:14px; font-weight:bold;">Lihat Semua</a>
            </div>
            <div id="recentHistory" class="history-list"></div>
        </main>
    </div>

    <script>
        document.getElementById('userNameDisplay').innerText = sessionStorage.getItem('userName') || 'User';
        document.getElementById('userRoleDisplay').innerText = sessionStorage.getItem('userRole') || 'Role';

        // Render riwayat (Sama seperti kode sebelumnya)
        let data = JSON.parse(localStorage.getItem('inventraLabData')) || [];
        if(data.length > 0) {
            let html = '';
            data.slice(0, 2).forEach(item => {
                html += `
                    <article class="history-item">
                        <span class="history-icon icon-good">✓</span>
                        <div class="history-text">
                            <strong>${item.kode} · ${item.nama}</strong>
                            <small>${item.lab} · ${item.tanggal}</small>
                        </div>
                        <span class="badge badge-good">${item.kondisi}</span>
                    </article>
                `;
            });
            document.getElementById('recentHistory').innerHTML = html;
        }
    </script>
</body>
</html>
