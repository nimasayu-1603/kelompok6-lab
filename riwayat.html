<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InventraLab - Riwayat</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Style khusus untuk tombol hapus */
        .btn-delete {
            background: #fdeaea; color: #c83b3b; border: none;
            width: 36px; height: 36px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background 0.2s; margin-left: auto;
        }
        .btn-delete:hover { background: #fca5a5; }
        .history-item { display: flex; align-items: center; gap: 12px; flex-wrap: nowrap; }
        .history-text { flex: 1; min-width: 0; }
    </style>
    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') { window.location.href = 'index.html'; }
    </script>
</head>
<body>
    <div id="appScreen" style="display:flex;">
        <header class="topbar">
            <div class="brand">
                <div class="brand-logo">IL</div>
                <div class="brand-text">InventraLab</div>
            </div>
            <div class="user-info">
                <div class="user-details">
                    <strong id="userNameDisplay">User</strong>
                    <span id="userRoleDisplay">Role</span>
                </div>
                <button onclick="sessionStorage.clear(); window.location.href='index.html';" class="btn-logout">LR</button>
            </div>
        </header>

        <nav class="nav-bar">
            <a href="index.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg><span>Beranda</span></a>
            <a href="#" class="active"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><span>Riwayat</span></a>
            <a href="laporan.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg><span>Laporan</span></a>
            <a href="dashboard.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg><span>Dasbor</span></a>
            <a href="panduan.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><span>Panduan</span></a>
            <a href="kontak.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg><span>Kontak</span></a>
        </nav>

        <main>
            <div class="section-head">
                <div>
                    <p class="eyebrow">PEMBARUAN TERAKHIR</p>
                    <h2>Riwayat Laporan</h2>
                </div>
                <a href="laporan.html" style="color:var(--blue); font-size:14px; font-weight:bold;">+ Tambah</a>
            </div>

            <div id="historyContainer" class="history-list"></div>
        </main>
    </div>

    <script>
        document.getElementById('userNameDisplay').innerText = sessionStorage.getItem('userName') || 'User';
        document.getElementById('userRoleDisplay').innerText = sessionStorage.getItem('userRole') || 'Role';

        const dummyData = [
            { id: 'dummy1', kode: 'LAB-01', nama: 'Budi Santoso', lab: 'Lab Komputer 1', kondisi: 'Baik', tanggal: '12 Nov 2026' },
            { id: 'dummy2', kode: 'LAB-08', nama: 'Siti Aminah', lab: 'Lab Komputer 3', kondisi: 'Perlu Perbaikan', tanggal: '11 Nov 2026' },
            { id: 'dummy3', kode: 'LAB-15', nama: 'Andi Wijaya', lab: 'Lab Komputer 5', kondisi: 'Rusak', tanggal: '10 Nov 2026' },
            { id: 'dummy4', kode: 'LAB-22', nama: 'Dewi Lestari', lab: 'Lab Komputer 8', kondisi: 'Baik', tanggal: '09 Nov 2026' }
        ];

        function tampilkanRiwayat() {
            const container = document.getElementById('historyContainer');
            let dataRiwayat = JSON.parse(localStorage.getItem('inventraLabData'));

            if (!dataRiwayat || dataRiwayat.length === 0) {
                dataRiwayat = dummyData;
            }

            let html = '';
            dataRiwayat.forEach((item, index) => {
                let badgeClass = 'badge-good';
                let iconClass = 'icon-good';
                let iconChar = '✓';

                if (item.kondisi === 'Perlu Perbaikan') { badgeClass = 'badge-warning'; iconClass = 'icon-warning'; iconChar = '◷'; } 
                else if (item.kondisi === 'Rusak' || item.kondisi === 'Hilang') { badgeClass = 'badge-danger'; iconClass = 'icon-danger'; iconChar = '!'; }

                html += `
                    <article class="history-item">
                        <span class="history-icon ${iconClass}">${iconChar}</span>
                        <div class="history-text">
                            <strong>${item.kode} · ${item.nama}</strong>
                            <small>${item.lab} · ${item.tanggal}</small>
                        </div>
                        <span class="badge ${badgeClass}">${item.kondisi}</span>
                        <button class="btn-delete" onclick="hapusLaporan('${item.id}')" title="Hapus Laporan">
                            <svg style="width:18px; height:18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </article>
                `;
            });
            container.innerHTML = html;
        }

        // Fungsi untuk menghapus laporan
        function hapusLaporan(id) {
            if (confirm('Apakah Anda yakin ingin menghapus laporan ini?')) {
                let dataRiwayat = JSON.parse(localStorage.getItem('inventraLabData')) || [];
                
                // Jika data masih menggunakan dummy (belum pernah nambah data), reset total
                if (dataRiwayat.length === 0) {
                    localStorage.setItem('inventraLabData', JSON.stringify([]));
                    // Trik agar dummy tidak muncul lagi: simpan array kosong
                    // Tapi karena fungsi tampilkanRiwayat akan memanggil dummy jika data kosong,
                    // kita harus ubah sedikit logikanya.
                    // Solusi: Jika yang dihapus adalah dummy, kita simpan penanda.
                    let dummyFiltered = dummyData.filter(d => d.id !== id);
                    // Kita simpan sisa dummy ke localStorage agar tidak balik ke awal
                    if(dummyFiltered.length > 0) {
                        localStorage.setItem('inventraLabData', JSON.stringify(dummyFiltered));
                    } else {
                         // Jika semua dummy dihapus, simpan array kosong tapi cegah dummy muncul
                         localStorage.setItem('inventraLabData', JSON.stringify([]));
                    }
                    tampilkanRiwayat();
                    return;
                }

                // Filter data untuk membuang yang ID-nya cocok
                const dataBaru = dataRiwayat.filter(item => item.id !== id);
                localStorage.setItem('inventraLabData', JSON.stringify(dataBaru));
                
                tampilkanRiwayat();
            }
        }

        tampilkanRiwayat();
    </script>
</body>
</html>
