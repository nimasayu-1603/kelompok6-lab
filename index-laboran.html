<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InventraLab - Kelola Laporan Laboran</title>
    <link rel="stylesheet" href="style.css">
    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'login.html';
        if (sessionStorage.getItem('userRole') !== 'Laboran') window.location.href = 'login.html';
    </script>
</head>
<body>
    <div id="appScreen" style="display:flex;">
        <header class="topbar">
            <div class="brand">
                <div class="brand-logo" style="background:var(--navy);">IL</div>
                <div class="brand-text">InventraLab <span style="background:var(--navy); color:white; font-size:10px; padding:2px 6px; border-radius:10px; margin-left:4px;">ADMIN</span></div>
            </div>
            <div class="user-info">
                <div class="user-details"><strong>Laboran</strong></div>
                <button onclick="sessionStorage.clear(); window.location.href='login.html';" class="btn-logout">LR</button>
            </div>
        </header>
        
        <nav class="nav-bar">
            <a href="index-laboran.html" class="active"><span>Kelola Laporan</span></a>
            <a href="dashboard-laboran.html"><span>Dasbor</span></a>
        </nav>

        <main>
            <div class="section-head">
                <div>
                    <p class="eyebrow">PANEL ADMIN</p>
                    <h2>Kelola Laporan Siswa</h2>
                </div>
            </div>
            <p style="color:var(--muted); margin-bottom:20px; font-size:14px;">Ubah status menjadi "Selesai" jika perangkat sudah diperbaiki.</p>

            <div id="laporanContainer" class="history-list" style="gap:16px;"></div>
        </main>
    </div>

    <script>
        function tampilkanLaporan() {
            const container = document.getElementById('laporanContainer');
            let data = JSON.parse(localStorage.getItem('inventraLabData')) || [];

            if (data.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted); background:white; border-radius:12px; border:1px solid var(--line);">Belum ada laporan dari siswa.</div>';
                return;
            }

            let html = '';
            data.forEach(item => {
                let badge = item.status === 'Selesai' ? 'badge-good' : 'badge-warning';
                
                let btn = '';
                if(item.status === 'Menunggu') {
                    btn = `<button onclick="selesaikan('${item.id}')" style="background:var(--green); color:white; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:12px;">Tandai Selesai</button>`;
                } else {
                    btn = `<span style="color:var(--green); font-weight:bold; font-size:12px;">✓ Sudah Diperbaiki</span>`;
                }

                html += `
                    <div class="history-item" style="display:flex; flex-direction:column; align-items:flex-start; gap:8px;">
                        <div style="width:100%; display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <strong>${item.kode}</strong>
                                <div style="font-size:12px; color:var(--muted); margin-top:2px;">Pelapor: ${item.nama} (${item.peran})</div>
                            </div>
                            <span class="badge ${badge}">${item.status}</span>
                        </div>
                        <div style="background:var(--canvas); padding:10px; border-radius:8px; font-size:13px; width:100%; border:1px solid var(--line); margin-top:4px;">
                            <strong>Kondisi:</strong> ${item.kondisi} | <strong>Lab:</strong> ${item.lab}<br>
                            <strong>Catatan:</strong> ${item.catatan || '-'}
                        </div>
                        <div style="width:100%; display:flex; justify-content:flex-end; margin-top:4px;">
                            ${btn}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function selesaikan(id) {
            if (confirm('Apakah Anda yakin perangkat ini telah selesai diperbaiki?')) {
                let data = JSON.parse(localStorage.getItem('inventraLabData')) || [];
                data = data.map(item => {
                    if (String(item.id) === String(id)) return { ...item, status: 'Selesai' };
                    return item;
                });
                localStorage.setItem('inventraLabData', JSON.stringify(data));
                tampilkanLaporan();
            }
        }

        tampilkanLaporan();
    </script>
</body>
</html>
