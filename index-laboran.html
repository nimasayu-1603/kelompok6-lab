<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InventraLab - Beranda Laboran</title>
    <link rel="stylesheet" href="style.css">
    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'login.html';
        if (sessionStorage.getItem('userRole') !== 'Laboran') window.location.href = 'login.html';
    </script>
</head>
<body>
    <div id="appScreen" style="display:flex;">
        <header class="topbar">
            <div class="brand">
                <div class="brand-logo" style="background:var(--navy);">IL</div>
                <div class="brand-text">InventraLab <span style="background:var(--navy); color:white; font-size:10px; padding:2px 6px; border-radius:10px; margin-left:4px;">ADMIN</span></div>
            </div>
            <div class="user-info">
                <div class="user-details"><strong>Laboran</strong><span>Admin</span></div>
                <button onclick="sessionStorage.clear(); window.location.href='login.html';" class="btn-logout">LR</button>
            </div>
        </header>
        
        <nav class="nav-bar">
            <!-- Semua tautan di sini sudah benar dan mengarah ke file yang akan dibuat -->
            <a href="index-laboran.html" class="active"><span>Beranda</span></a>
            <a href="kelola-laporan.html"><span>Kelola Laporan</span></a>
            <a href="dashboard-laboran.html"><span>Dasbor</span></a>
        </nav>

        <main>
            <div class="hero-card" style="background:var(--navy); color:white; margin-bottom:24px;">
                <p class="eyebrow" style="color:#93c5fd;">PANEL ADMINISTRATOR</p>
                <h1 style="color:white;">Selamat Datang, Laboran!</h1>
                <p style="opacity:0.8; font-size:14px;">Tugas Anda adalah memverifikasi laporan siswa dan memperbarui status perbaikan perangkat.</p>
                <a href="kelola-laporan.html" class="btn-primary" style="display:inline-flex; width:auto; margin-top:16px; background:white; color:var(--navy);">
                    Buka Halaman Kelola
                </a>
            </div>

            <div class="metrics">
                <article><strong id="statTotal" style="color:var(--blue);">0</strong><span>Total Laporan</span></article>
                <article><strong id="statPending" style="color:var(--orange);">0</strong><span>Belum Diperbaiki</span></article>
                <article><strong id="statSelesai" style="color:var(--green);">0</strong><span>Selesai</span></article>
            </div>
        </main>
    </div>

    <script>
        let data = JSON.parse(localStorage.getItem('inventraLabData')) || [];
        document.getElementById('statTotal').innerText = data.length;
        document.getElementById('statPending').innerText = data.filter(d => d.status === 'Menunggu').length;
        document.getElementById('statSelesai').innerText = data.filter(d => d.status === 'Selesai').length;
    </script>
</body>
</html>
