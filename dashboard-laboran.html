<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InventraLab - Dasbor Admin</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-badge { background: var(--navy); color: #fff; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 99px; margin-left: 6px; vertical-align: middle; }
        .quick-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
        .quick-actions a { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 16px; font-weight: 700; font-size: 13px; color: var(--ink); transition: border-color .2s, transform .2s; }
        .quick-actions a:hover { border-color: var(--blue); transform: translateY(-2px); }
        .quick-actions a .qa-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .qa-blue { background: var(--blue-soft); color: var(--blue); }
        .qa-green { background: #e9f7ef; color: var(--green); }
        .qa-orange { background: #fff4df; color: var(--orange); }
        .qa-red { background: #fdeaea; color: var(--red); }
        @media (min-width: 768px) { .quick-actions { grid-template-columns: repeat(4, 1fr); } }
    </style>
    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') { window.location.href = 'index.html'; }
        if (sessionStorage.getItem('userRole') !== 'Laboran') { window.location.href = 'dashboard.html'; }
    </script>
</head>
<body>
    <div id="appScreen" style="display:flex;">
        <header class="topbar">
            <div class="brand">
                <div class="brand-logo">IL</div>
                <div class="brand-text">InventraLab <span class="admin-badge">ADMIN</span></div>
            </div>
            <div class="user-info">
                <div class="user-details">
                    <strong id="userNameDisplay">User</strong>
                    <span id="userRoleDisplay">Role</span>
                </div>
                <button onclick="sessionStorage.clear(); window.location.href='index.html';" class="btn-logout">LR</button>
            </div>
        </header>

        <nav class="nav-bar">
            <a href="dashboard-admin.html" class="active">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                <span>Dasbor</span>
            </a>
            <a href="kelola-laporan.html">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>Kelola</span>
            </a>
            <a href="data-perangkat.html">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                <span>Perangkat</span>
            </a>
            <a href="riwayat.html">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>Riwayat</span>
            </a>
            <a href="panduan.html">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>Panduan</span>
            </a>
        </nav>

        <main>
            <div class="section-head">
                <div>
                    <p class="eyebrow">PANEL ADMINISTRATOR</p>
                    <h2>Dasbor Laboran</h2>
                </div>
                <span class="badge badge-good">Aktif</span>
            </div>

            <div class="metrics" style="margin-top:0; margin-bottom:24px;">
                <article>
                    <strong id="statTotal" style="color:var(--blue);">0</strong>
                    <span>Total Laporan</span>
                </article>
                <article>
                    <strong id="statPending" style="color:var(--orange);">0</strong>
                    <span>Menunggu Verifikasi</span>
                </article>
                <article>
                    <strong id="statRusak" style="color:var(--red);">0</strong>
                    <span>Perlu Perbaikan</span>
                </article>
            </div>

            <h3 style="font-size:16px; margin-bottom:12px;">Aksi Cepat</h3>
            <div class="quick-actions">
                <a href="laporan.html">
                    <span class="qa-icon qa-blue">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    </span>
                    Buat Laporan
                </a>
                <a href="kelola-laporan.html">
                    <span class="qa-icon qa-orange">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                    </span>
                    Verifikasi Laporan
                </a>
                <a href="data-perangkat.html">
                    <span class="qa-icon qa-green">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    </span>
                    Kelola Perangkat
                </a>
                <a href="riwayat.html">
                    <span class="qa-icon qa-red">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </span>
                    Lihat Riwayat
                </a>
            </div>

            <div class="section-head" style="margin-top:24px;">
                <h3 style="font-size:16px;">Laporan Menunggu Verifikasi</h3>
                <a href="kelola-laporan.html" style="color:var(--blue); font-size:13px; font-weight:bold;">Kelola Semua</a>
            </div>
            <div id="pendingList" class="history-list"></div>
        </main>
    </div>

    <script>
        document.getElementById('userNameDisplay').innerText = sessionStorage.getItem('userName') || 'Laboran';
        document.getElementById('userRoleDisplay').innerText = sessionStorage.getItem('userRole') || 'Laboran';

        function renderDashboard() {
            const data = JSON.parse(localStorage.getItem('inventraLabData')) || [];
            document.getElementById('statTotal').innerText = data.length;
            document.getElementById('statPending').innerText = data.filter(d => !d.status || d.status === 'Menunggu').length;
            document.getElementById('statRusak').innerText = data.filter(d => ['Perlu Perbaikan','Rusak','Hilang'].includes(d.kondisi)).length;

            const pending = data.filter(d => !d.status || d.status === 'Menunggu').slice(0, 5);
            const container = document.getElementById('pendingList');
            if (pending.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:20px;background:white;border-radius:12px;border:1px solid var(--line);color:var(--muted);font-size:14px;">Tidak ada laporan menunggu verifikasi. 🎉</div>';
                return;
            }
            container.innerHTML = pending.map(item => `
                <article class="history-item">
                    <span class="history-icon icon-warning">◷</span>
                    <div class="history-text">
                        <strong>${item.kode} · ${item.nama}</strong>
                        <small>${item.lab} · ${item.tanggal}</small>
                    </div>
                    <span class="badge badge-warning">${item.status || 'Menunggu'}</span>
                </article>
            `).join('');
        }
        renderDashboard();
    </script>
</body>
</html>
