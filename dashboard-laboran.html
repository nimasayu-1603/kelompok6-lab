<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InventraLab - Dasbor Laboran</title>
    <link rel="stylesheet" href="style.css">
    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'login.html';
        if (sessionStorage.getItem('userRole') !== 'Laboran') window.location.href = 'login.html';
    </script>
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">
    <div id="appScreen" style="display:flex; flex-direction:column; flex:1;">
        <header class="topbar">
            <div class="brand">
                <div class="brand-logo" style="background:var(--blue);">IL</div>
                <div class="brand-text">InventraLab</div>
            </div>
            <div class="user-info">
                <!-- Ikon Logout -->
                <button onclick="sessionStorage.clear(); window.location.href='login.html';" class="btn-logout" title="Keluar">
                    <svg style="width:18px; height:18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </header>

        <nav class="nav-bar">
            <a href="index-laboran.html">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span>Beranda</span>
            </a>
            <a href="kelola-laboran.html">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>Kelola</span>
            </a>
            <a href="dashboard-laboran.html" class="active">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                <span>Dasbor</span>
            </a>
            <a href="about.html">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>Tentang</span>
            </a>
        </nav>

        <main style="flex:1;">
            <div class="section-title">
                <p class="eyebrow">STATISTIK GLOBAL</p>
                <h2>Dasbor Laboran</h2>
            </div>

            <div class="metrics">
                <article><strong id="statTotal" style="color:var(--blue);">0</strong><span>Total Laporan</span></article>
                <article><strong id="statPending" style="color:var(--orange);">0</strong><span>Belum Diperbaiki</span></article>
                <article><strong id="statSelesai" style="color:var(--green);">0</strong><span>Telah Diperbaiki</span></article>
            </div>
        </main>
    </div>
    <footer style="text-align:center; padding:20px; font-size:13px; color:var(--muted); border-top:1px solid var(--line); background:white;">
        Copyright &copy; 2026 - Kelompok 6
    </footer>
    <script>
        let data = JSON.parse(localStorage.getItem('inventraLabData')) || [];
        document.getElementById('statTotal').innerText = data.length;
        document.getElementById('statPending').innerText = data.filter(d => d.status === 'Menunggu').length;
        document.getElementById('statSelesai').innerText = data.filter(d => d.status === 'Selesai').length;
    </script>
</body>
</html>
