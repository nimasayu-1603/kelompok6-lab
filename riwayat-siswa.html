<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>InventraLab - Riwayat</title>
    <link rel="stylesheet" href="style.css">
    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'index.html';
        if (sessionStorage.getItem('userRole') !== 'Siswa') window.location.href = 'index.html';
    </script>
</head>
<body style="display:flex; flex-direction:column; min-height:100vh; padding-bottom: 80px;">
    <div id="appScreen" style="display:flex; flex-direction:column; flex:1;">
        <header class="topbar">
            <div class="brand"><div class="brand-logo" style="background:var(--blue);">IL</div><div class="brand-text">InventraLab</div></div>
            <div class="user-info">
                <div class="user-details"><strong id="userNameDisplay">Siswa RPL</strong><span>Siswa</span></div>
                <button onclick="sessionStorage.clear(); window.location.href='index.html';" class="btn-logout" title="Keluar">
                    <svg style="width:18px; height:18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </header>
        
        <nav class="nav-bar">
            <a href="index-siswa.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg><span>Beranda</span></a>
            <a href="dashboard-siswa.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg><span>Dasbor</span></a>
            <a href="laporan-siswa.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg><span>Laporan</span></a>
            <a href="riwayat-siswa.html" class="active"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><span>Riwayat</span></a>
            <a href="kontak-siswa.html"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><span>Kontak</span></a>
        </nav>

        <main style="flex:1; padding: 20px;">
            <div class="container" style="max-width: 800px; margin: 0 auto;">
                <div class="section-title"><h2>Riwayat Laporan Anda</h2></div>
                <div id="historyContainer" class="history-list"></div>
            </div>
        </main>
    </div>
    <footer style="text-align:center; padding:20px; font-size:13px; color:var(--muted); border-top:1px solid var(--line); background:white; margin-bottom: 60px;">Copyright &copy; 2026 - Kelompok 6</footer>
    
    <script>
        const currentUser = sessionStorage.getItem('userName');
        let data = JSON.parse(localStorage.getItem('inventraLabData')) || [];
        let myData = data.filter(item => item.nama === currentUser);
        
        if (myData.length === 0) {
            document.getElementById('historyContainer').innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted); background:white; border-radius:12px; border:1px solid var(--line);">Belum ada riwayat.</div>';
        } else {
            let html = '';
            myData.forEach(item => {
                let badge = item.status === 'Selesai' ? 'badge-good' : 'badge-warning';
                html += `<article class="history-item" style="display:flex; flex-direction:column; align-items:flex-start; gap:8px;"><div style="width:100%; display:flex; justify-content:space-between;"><strong>${item.kode}</strong><span class="badge ${badge}">${item.status}</span></div><small style="color:var(--muted);">${item.lab} · ${item.tanggal}</small><div style="background:var(--canvas); padding:10px; border-radius:8px; font-size:13px; width:100%; border:1px solid var(--line); margin-top:4px;"><b>Kondisi:</b> ${item.kondisi}<br><b>Catatan:</b> ${item.catatan || '-'}</div></article>`;
            });
            document.getElementById('historyContainer').innerHTML = html;
        }
    </script>
</body>
</html>
