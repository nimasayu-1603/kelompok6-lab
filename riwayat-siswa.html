<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Riwayat - InventraLab</title>
    <link rel="stylesheet" href="style.css">
    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') window.location.href = 'index.html';
        if (sessionStorage.getItem('userRole') !== 'Siswa') window.location.href = 'index.html';
    </script>
</head>
<body style="display:flex; flex-direction:column; min-height:100vh; padding-bottom: 80px;">
    <div id="appScreen" style="display:flex; flex-direction:column; flex:1;">
        <header class="topbar">
            <div class="brand"><div class="brand-logo" style="background:var(--blue);">IL</div><div class="brand-text">InventraLab</div></div>
            <div class="user-info"><button onclick="sessionStorage.clear(); window.location.href='index.html';" class="btn-logout"><svg style="width:18px; height:18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg></button></div>
        </header>
        <nav class="nav-bar">
            <a href="index-siswa.html"><span>Beranda</span></a>
            <a href="dashboard-siswa.html"><span>Dasbor</span></a>
            <a href="laporan-siswa.html"><span>Laporan</span></a>
            <a href="riwayat-siswa.html" class="active"><span>Riwayat</span></a>
            <a href="about.html"><span>Tentang</span></a>
        </nav>
        <main style="flex:1;">
            <h2>Riwayat Laporan Anda</h2>
            <div id="historyContainer" class="history-list" style="margin-top:16px;"></div>
        </main>
    </div>
    <footer style="text-align:center; padding:20px; font-size:13px; color:var(--muted); border-top:1px solid var(--line); background:white; margin-bottom: 60px;">
        Copyright &copy; 2026 - Kelompok 6
    </footer>
    <script>
        const currentUser = sessionStorage.getItem('userName');
        let data = JSON.parse(localStorage.getItem('inventraLabData')) || [];
        let myData = data.filter(item => item.nama === currentUser);
        if (myData.length === 0) {
            document.getElementById('historyContainer').innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted);">Belum ada riwayat.</div>';
        } else {
            let html = '';
            myData.forEach(item => {
                let badge = item.status === 'Selesai' ? 'badge-good' : 'badge-warning';
                html += `<article class="history-item" style="display:flex; flex-direction:column; align-items:flex-start; gap:8px;"><div style="width:100%; display:flex; justify-content:space-between;"><strong>${item.kode}</strong><span class="badge ${badge}">${item.status}</span></div><small style="color:var(--muted);">${item.lab} · ${item.tanggal}</small><div style="background:var(--canvas); padding:10px; border-radius:8px; font-size:13px; width:100%; border:1px solid var(--line); margin-top:4px;"><b>Kondisi:</b> ${item.kondisi}<br><b>Catatan:</b> ${item.catatan || '-'}</div></article>`;
            });
            document.getElementById('historyContainer').innerHTML = html;
        }
    </script>
</body>
</html>
